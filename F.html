<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kayıt Formu</title>
</head>
<body>
  <h1>Kullanıcı Kayıt Formu</h1>

  <!-- Sadece HTML: form gönderimi için enctype dosya yüklemeleriyle uyumlu -->
  <form action="#" method="post" enctype="multipart/form-data" novalidate>

    <label for="fullname">Ad Soyad *</label><br>
    <input type="text" id="fullname" name="fullname" placeholder="Ad Soyad" required><br><br>

    <label for="email">E-posta *</label><br>
    <input type="email" id="email" name="email" placeholder="ornek@domain.com" required><br><br>

    <label for="password">Şifre *</label><br>
    <input type="password" id="password" name="password" placeholder="En az 6 karakter" minlength="6" required><br><br>

    <label for="birthdate">Doğum Tarihi</label><br>
    <input type="date" id="birthdate" name="birthdate"><br><br>

    <label for="address">Adres</label><br>
    <textarea id="address" name="address" rows="3" cols="40" placeholder="Adresinizi giriniz..."></textarea><br><br>

    <label for="profile">Profil Resmi (jpg, png)</label><br>
    <input type="file" id="profile" name="profile" accept="image/*"><br><br>

    <fieldset>
      <legend>Hobiler (Birden çok seçilebilir)</legend>
      <input type="checkbox" id="hobby_read" name="hobbies" value="okuma">
      <label for="hobby_read">Kitap Okuma</label><br>
      <input type="checkbox" id="hobby_sport" name="hobbies" value="spor">
      <label for="hobby_sport">Spor</label><br>
      <input type="checkbox" id="hobby_music" name="hobbies" value="muzik">
      <label for="hobby_music">Müzik</label><br>
      <input type="checkbox" id="hobby_travel" name="hobbies" value="seyahat">
      <label for="hobby_travel">Seyahat</label>
    </fieldset>
    <br>

    <fieldset>
      <legend>Cinsiyet</legend>
      <input type="radio" id="gender_m" name="gender" value="erkek">
      <label for="gender_m">Erkek</label><br>
      <input type="radio" id="gender_f" name="gender" value="kadin">
      <label for="gender_f">Kadın</label><br>
    </fieldset>
    <br>

    <label for="cv">CV (PDF)</label><br>
    <input type="file" id="cv" name="cv" accept="application/pdf"><br><br>

    <button type="submit">Gönder</button>
    <button type="reset">Temizle</button>

  </form>

  <p style="font-size:0.9em; color:#666;">* İşaretli alanlar zorunludur.</p>

</body>
</html>
